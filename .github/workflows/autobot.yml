name: Autonomous Project Bot

on:
  schedule:
    - cron: '30 6 * * *' # Once per day at 12:00 PM IST (06:30 UTC)
  workflow_dispatch:

jobs:
  autobot:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Autonomous Bot (retry once)
        run: |
          python -m bot.main || (echo "First attempt failed, retrying once..." && sleep 10 && python -m bot.main)

      - name: Run Complexity & Performance Checks
        run: python -m bot.complexity && python -m bot.perfguard

      - name: Enforce Commit Policy
        run: python -m bot.gitops check_commits
